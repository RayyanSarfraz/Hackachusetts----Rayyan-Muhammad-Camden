# Production-ish stack for a public demo: PostgreSQL + Django (gunicorn) + client
# (nginx serving the built SPA and reverse-proxying /api to the backend).
#
# Only the client is published publicly (port 80). nginx proxies /api/ to the
# api service over the internal Docker network, so the backend is never exposed
# directly. The db is not published at all.
#
#   docker compose -f compose.prod.yaml up --build -d
#
# Configure secrets/hosts in a .env file next to this one (see keys below).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-config}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-config}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      target: production
    restart: unless-stopped
    # Seed trial data on first boot (production entrypoint does not auto-seed),
    # then run gunicorn. Runs every start but ingest is an idempotent upsert.
    command: >
      sh -c "python manage.py ingest_trials /data/source/trials/data.csv || true;
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "False"
      # Include the api service name so nginx->api proxying passes ALLOWED_HOSTS.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api,localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost}
      # The demo is fronted by plain HTTP; disable the HTTPS redirect so the app
      # is reachable. Set to True (and put a TLS proxy in front) for real prod.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-config}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CHROMA_PERSIST_DIR: /data/chroma
      # AI model (optional). Leave empty to run with the model "unavailable";
      # the engine degrades gracefully and never fabricates facts.
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-google/medgemma-1.5-4b-it}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-clinical_trials}
    volumes:
      - ./data:/data/source:ro
      - chroma_data:/data/chroma
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: production
    restart: unless-stopped
    # The one public entrypoint. nginx serves the built SPA and proxies /api.
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  chroma_data:
