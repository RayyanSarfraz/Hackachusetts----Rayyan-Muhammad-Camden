# Local development stack: PostgreSQL + Django API + React (Vite) client.
# Start everything with:  docker compose up --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-config}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Publish only to loopback so local tools can connect; not exposed publicly.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-config}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      target: development
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-config}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # AI model service (MedGemma via vLLM). Empty => engine runs model-"unavailable".
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-google/medgemma-1.5-4b-it}
      # Vector store (ChromaDB local persistent client) — persisted to a volume.
      CHROMA_PERSIST_DIR: /data/chroma
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-clinical_trials}
    volumes:
      - ./api:/app
      # Trial dataset (read-only) available to the ingest command inside the container.
      - ./data:/data/source:ro
      # Persist the Chroma index across container restarts.
      - chroma_data:/data/chroma
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./client:/app
      # Keep container node_modules isolated from the host bind mount.
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  chroma_data:
